<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-labelledby="dt dd">
  <title id="dt">Section divider</title>
  <desc id="dd">A thin cyan gradient line with a glowing pulse traveling from left to right.</desc>
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <line x1="80" y1="18" x2="1120" y2="18" stroke="url(#dg)" stroke-width="1.6"/>
  <circle cx="80" cy="18" r="2" fill="#1E3A5F"/>
  <circle cx="1120" cy="18" r="2" fill="#1E3A5F"/>

  <circle r="3" fill="#67E8F9" filter="url(#dglow)">
    <animateMotion dur="4.6s" repeatCount="indefinite" path="M80 18 H1120"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.92;1" dur="4.6s" repeatCount="indefinite"/>
  </circle>
</svg>
