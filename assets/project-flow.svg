<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="56" viewBox="0 0 1200 56" role="img" aria-labelledby="ft2 fd2">
  <title id="ft2">Project separator</title>
  <desc id="fd2">A thin cyan line that draws itself between projects, passing through a diamond node.</desc>
  <defs>
    <linearGradient id="pfg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>
    <filter id="pfglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- faint base line -->
  <line x1="60" y1="28" x2="1140" y2="28" stroke="#1E3A5F" stroke-width="1" opacity=".55"/>
  <circle cx="60" cy="28" r="2.4" fill="#1E3A5F"/>
  <circle cx="1140" cy="28" r="2.4" fill="#1E3A5F"/>

  <!-- self-drawing gradient line -->
  <line x1="60" y1="28" x2="1140" y2="28" stroke="url(#pfg)" stroke-width="1.6"
        stroke-dasharray="1080" stroke-dashoffset="1080">
    <animate attributeName="stroke-dashoffset" values="1080;0;0" keyTimes="0;.42;1" dur="8s" repeatCount="indefinite"/>
  </line>

  <!-- comet synced to the draw phase -->
  <circle r="2.6" fill="#67E8F9" filter="url(#pfglow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M60 28 L1140 28" keyPoints="0;1;1" keyTimes="0;.42;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.38;.44;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- center diamond -->
  <rect x="594" y="22" width="12" height="12" rx="2" transform="rotate(45 600 28)"
        fill="#07111F" stroke="#0EA5E9" stroke-width="1.3">
    <animate attributeName="opacity" values=".55;1;.55" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
