<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-labelledby="pt pd">
  <title id="pt">Project connector</title>
  <desc id="pd">A horizontal data line with pulsing nodes and a glowing packet traveling across it.</desc>
  <defs>
    <filter id="pglow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .dash { animation: crawl 20s linear infinite; }
    @keyframes crawl { to { stroke-dashoffset: -320; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- base line -->
  <line x1="60" y1="36" x2="1140" y2="36" stroke="#1E3A5F" stroke-width="1.5"/>
  <line class="dash" x1="60" y1="36" x2="1140" y2="36" stroke="#0EA5E9" stroke-width="1.4" opacity=".35" stroke-dasharray="2 14"/>
  <path d="M1132 30 l10 6 l-10 6" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- nodes -->
  <g>
    <circle cx="240" cy="36" r="8" fill="#07111F" stroke="#0EA5E9"/>
    <circle cx="240" cy="36" r="3" fill="#67E8F9"/>
    <circle cx="240" cy="36" r="8" fill="none" stroke="#38BDF8">
      <animate attributeName="r" values="8;20" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="480" cy="36" r="8" fill="#07111F" stroke="#0EA5E9"/>
    <circle cx="480" cy="36" r="3" fill="#67E8F9"/>
    <circle cx="480" cy="36" r="8" fill="none" stroke="#38BDF8">
      <animate attributeName="r" values="8;20" dur="3.6s" begin="-.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0" dur="3.6s" begin="-.9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="720" cy="36" r="8" fill="#07111F" stroke="#0EA5E9"/>
    <circle cx="720" cy="36" r="3" fill="#67E8F9"/>
    <circle cx="720" cy="36" r="8" fill="none" stroke="#38BDF8">
      <animate attributeName="r" values="8;20" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0" dur="3.6s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="960" cy="36" r="8" fill="#07111F" stroke="#0EA5E9"/>
    <circle cx="960" cy="36" r="3" fill="#67E8F9"/>
    <circle cx="960" cy="36" r="8" fill="none" stroke="#38BDF8">
      <animate attributeName="r" values="8;20" dur="3.6s" begin="-2.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0" dur="3.6s" begin="-2.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- traveling packet -->
  <circle r="3" fill="#38BDF8" filter="url(#pglow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M60 36 L1140 36"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.94;1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
