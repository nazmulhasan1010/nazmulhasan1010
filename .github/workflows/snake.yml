name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # runs daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVG (dark theme, cyan palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-snake.svg?palette=github-dark&color_snake=%230EA5E9&color_dots=%2313273D,%230B4A6B,%230891B2,%230EA5E9,%2367E8F9

      - name: Move snake into assets
        run: |
          mkdir -p assets
          cp dist/contribution-snake.svg assets/contribution-snake.svg

      - name: Commit and push updated snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg
          git diff --staged --quiet || git commit -m "chore: update contribution snake [skip ci]"
          git push
